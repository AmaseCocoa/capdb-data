name: 🍜 カップ麺データの追加・修正
description: カップ麺データの追加・修正をリクエストします。
title: "[データ追加/修正]: "
labels: ["データ追加・修正"]
body:
  - type: dropdown
    id: request-type
    attributes:
      label: リクエストの種類
      options: [追加, 修正]
    validations:
      required: true
  - type: input
    id: product-name
    attributes:
      label: 商品名
    validations:
      required: true
  - type: input
    id: jan-code
    attributes:
      label: JANコード (バーコードの数字)
      description: EAN-13形式の13桁の半角数字（チェックディジットを含む）
      placeholder: "4902105284919"
    validations:
      required: true
  - type: input
    id: cooking-time
    attributes:
      label: 調理時間（秒）
      description: 0〜900 の整数。3分なら180、4分なら240。
      placeholder: "180"
    validations:
      required: true
  - type: dropdown
    id: has-drain
    attributes:
      label: 湯切り
      options: [不要, 必要]
    validations:
      required: true
  - type: input
    id: official-url
    attributes:
      label: 公式URL
      description: メーカーの商品情報のURL（http または https）
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: 補足・参考情報
      description: 修正理由など。JSONには含まれません。
    validations:
      required: false
