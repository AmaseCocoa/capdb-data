name: Tag changes
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tag-changes
  cancel-in-progress: false
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Create a tag if HEAD is not tagged
        shell: bash
        run: |
          set -euo pipefail
          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            echo 'HEAD is already tagged; skipping.'
            exit 0
          fi

          tag="v$(date -u +%Y%m%d%H%M%S)"
          git tag "$tag"
          git push origin "refs/tags/$tag"
