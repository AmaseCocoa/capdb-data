name: Product data requests
on:
  issues:
    types: [opened, edited, reopened, labeled]
  issue_comment:
    types: [created]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: data-requests
  cancel-in-progress: false
jobs:
  requests:
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request == null && github.event.comment.body == '/create')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { run } = require('./.github/scripts/data-request.cjs');
            await run({ github, context });
